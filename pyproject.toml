[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "semshift"
version = "0.2.0"
description = "Local-first semantic review assistant that flags likely risky meaning changes in edited text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Veeraj Sai" }
]
maintainers = [
  { name = "Veeraj Sai" }
]
keywords = [
  "semantic-diff",
  "semantic-shift",
  "embeddings",
  "cli",
  "documentation",
  "policy",
  "prompt-engineering",
  "github-actions",
  "local-first",
  "nlp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.24,<3",
  "pyyaml>=6,<7",
  "rich>=13.7,<15",
  "scikit-learn>=1.3,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=2.7,<4",
]
formats = [
  "pypdf>=4,<7",
  "python-docx>=1,<2",
]
dev = [
  "build>=1.2,<2",
  "pre-commit>=3.7,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "twine>=5.0,<7",
]
dev-models = [
  "build>=1.2,<2",
  "pre-commit>=3.7,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "sentence-transformers>=2.7,<4",
  "twine>=5.0,<7",
]

[project.urls]
Homepage = "https://semshift-landing.vercel.app/"
Repository = "https://github.com/VeerajSai/SemShift"
Issues = "https://github.com/VeerajSai/SemShift/issues"
Documentation = "https://github.com/VeerajSai/SemShift/tree/main/docs"
Changelog = "https://github.com/VeerajSai/SemShift/blob/main/CHANGELOG.md"
Security = "https://github.com/VeerajSai/SemShift/security/policy"

[project.scripts]
semshift = "semshift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["semshift"]

[tool.hatch.build.targets.sdist]
include = [
  "/semshift",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/action.yml",
  "/.github/workflows/ci.yml",
  "/docs",
  "/CITATION.cff",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
