name: "SemShift Check"
description: "Local-first semantic review assistant that flags likely risky meaning changes in pull requests."
author: "Veeraj Sai"

branding:
  icon: "git-pull-request"
  color: "blue"

inputs:
  files:
    description: "Comma-separated files or glob patterns. Leave empty to compare changed supported files in the PR."
    required: false
    default: ""
  paths:
    description: "Comma-separated include globs applied to changed or explicit files. Empty means all supported files."
    required: false
    default: ""
  exclude_paths:
    description: "Comma-separated exclude globs applied to changed or explicit files."
    required: false
    default: ".github/workflows/**"
  mode:
    description: "Review mode: default, readme, policy, research, resume, or prompt."
    required: false
    default: "default"
  fail_on:
    description: "Fail the action when drift reaches this label: low, medium, high, critical, or none for warn-only. Default: high."
    required: false
    default: "high"
  model:
    description: "Backend. Defaults to the lexical TF-IDF backend; pass an optional SentenceTransformers model for local semantic embeddings."
    required: false
    default: "tfidf"
  report:
    description: "Markdown report artifact path."
    required: false
    default: "semshift-report.md"
  artifact_name:
    description: "Name for the uploaded Markdown report artifact."
    required: false
    default: "semshift-report"
  base_ref:
    description: "Base ref to compare against. Defaults to the pull request base branch."
    required: false
    default: ""
  pr_comment:
    description: "Post or update a SemShift summary comment on pull requests."
    required: false
    default: "false"
  github_token:
    description: "GitHub token used for PR comments. Defaults to github.token when pr_comment is true."
    required: false
    default: ""
  max_file_size:
    description: "Maximum bytes to read per file before truncating with a warning."
    required: false
    default: "5242880"
  max_chunks:
    description: "Maximum chunks to compare per side before truncating with a warning."
    required: false
    default: "2000"

outputs:
  report_path:
    description: "Path to the generated SemShift markdown report."
    value: ${{ steps.semshift.outputs.report_path }}
  worst_label:
    description: "Worst drift label found across compared files."
    value: ${{ steps.semshift.outputs.worst_label }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install SemShift
      shell: bash
      env:
        SEMSHIFT_ACTION_PATH: ${{ github.action_path }}
        SEMSHIFT_MODEL: ${{ inputs.model }}
      run: |
        if [ "$SEMSHIFT_MODEL" = "tfidf" ] || [ "$SEMSHIFT_MODEL" = "lexical" ]; then
          python -m pip install "numpy>=1.24,<3" "rich>=13.7,<15" "scikit-learn>=1.3,<2" "typer>=0.12,<1"
          python -m pip install --no-deps "$SEMSHIFT_ACTION_PATH"
        else
          python -m pip install "$SEMSHIFT_ACTION_PATH[models]"
        fi

    - name: Run SemShift
      id: semshift
      shell: bash
      env:
        SEMSHIFT_BASE_REF: ${{ inputs.base_ref }}
        SEMSHIFT_FILES: ${{ inputs.files }}
        SEMSHIFT_PATHS: ${{ inputs.paths }}
        SEMSHIFT_EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        SEMSHIFT_MODE: ${{ inputs.mode }}
        SEMSHIFT_FAIL_ON: ${{ inputs.fail_on }}
        SEMSHIFT_MODEL: ${{ inputs.model }}
        SEMSHIFT_REPORT: ${{ inputs.report }}
        SEMSHIFT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        SEMSHIFT_PR_COMMENT: ${{ inputs.pr_comment }}
        SEMSHIFT_MAX_FILE_SIZE: ${{ inputs.max_file_size }}
        SEMSHIFT_MAX_CHUNKS: ${{ inputs.max_chunks }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
      run: |
        python -m semshift.integrations.github_action \
          --files "$SEMSHIFT_FILES" \
          --paths "$SEMSHIFT_PATHS" \
          --exclude-paths "$SEMSHIFT_EXCLUDE_PATHS" \
          --mode "$SEMSHIFT_MODE" \
          --fail-on "$SEMSHIFT_FAIL_ON" \
          --model "$SEMSHIFT_MODEL" \
          --report "$SEMSHIFT_REPORT" \
          --artifact-name "$SEMSHIFT_ARTIFACT_NAME" \
          --base-ref "$SEMSHIFT_BASE_REF" \
          --pr-comment "$SEMSHIFT_PR_COMMENT" \
          --github-token "$GITHUB_TOKEN" \
          --max-file-size "$SEMSHIFT_MAX_FILE_SIZE" \
          --max-chunks "$SEMSHIFT_MAX_CHUNKS"

    - name: Upload SemShift report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: "${{ inputs.artifact_name }}"
        path: "${{ inputs.report }}"
