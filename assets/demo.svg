<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="15">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AE5FF"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6B7BFF"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="920" height="600" rx="16" fill="#06070a"/>
  <rect x="16" y="16" width="888" height="568" rx="14" fill="#0a0c12" stroke="#1b2030" stroke-width="1"/>

  <!-- window chrome -->
  <rect x="16" y="16" width="888" height="44" rx="14" fill="#11141d"/>
  <rect x="16" y="46" width="888" height="14" fill="#11141d"/>
  <circle cx="42" cy="38" r="6" fill="#ff5f57"/>
  <circle cx="64" cy="38" r="6" fill="#febc2e"/>
  <circle cx="86" cy="38" r="6" fill="#28c840"/>
  <text x="460" y="43" text-anchor="middle" fill="#535a6c" font-size="13">semshift — semantic review</text>

  <!-- terminal body -->
  <text x="36" y="96" fill="#535a6c">$</text>
  <text x="54" y="96" fill="#f5f7fb">semshift compare old_policy.md new_policy.md <tspan fill="#7AE5FF">--mode policy</tspan></text>

  <text x="36" y="138" fill="#A78BFA">SemShift Report</text>
  <text x="200" y="138" fill="#535a6c">·  policy mode  ·  backend: tfidf (lexical)</text>

  <text x="36" y="176" fill="#c8cdda">Overall drift score: <tspan fill="#f5f7fb" font-weight="700">0.70</tspan>   <tspan fill="#FF7A8A" font-weight="700">CRITICAL</tspan></text>

  <text x="36" y="214" fill="#535a6c">Review summary</text>
  <text x="36" y="238" fill="#c8cdda">  4 semantically changed chunks   ·   5 changed claims</text>
  <text x="36" y="262" fill="#c8cdda">  Tone shifted: <tspan fill="#FFC56B">risky → restrictive</tspan></text>
  <text x="36" y="286" fill="#FF7A8A">  ⚠ Risk increased: third-party sharing (critical)</text>

  <text x="36" y="324" fill="#535a6c">Top meaning change — Data Sharing  ·  drift 0.52</text>
  <text x="36" y="350" fill="#ffb3bd">  - We do not share personal data with third parties.</text>
  <text x="36" y="374" fill="#9aebc4">  + We may share personal data with selected partners.</text>

  <text x="36" y="412" fill="#535a6c">Recommendation</text>
  <text x="36" y="436" fill="#FFC56B">  Hold approval until a human reviews the change.</text>

  <!-- accent underline + cursor -->
  <rect x="36" y="468" width="848" height="1" fill="#1b2030"/>
  <text x="36" y="498" fill="#5BE2A8">  ✓ local · deterministic · no data leaves your machine</text>
  <rect x="392" y="486" width="9" height="16" fill="#7AE5FF">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- brand mark -->
  <rect x="820" y="520" width="64" height="48" rx="10" fill="none"/>
  <rect x="828" y="532" width="22" height="22" rx="6" fill="url(#glow)"/>
  <text x="858" y="549" fill="#858da3" font-size="13" font-weight="600">SemShift</text>
</svg>
