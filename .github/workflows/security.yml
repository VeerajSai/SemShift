name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "24 3 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tools
        run: python -m pip install pip-audit bandit
      - name: pip-audit
        run: pip-audit
      - name: bandit
        run: bandit -r semshift -q
