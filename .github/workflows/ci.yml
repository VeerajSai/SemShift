name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Lint and format are platform-independent: run them only on Linux.
      - name: Ruff check
        if: matrix.os == 'ubuntu-latest'
        run: ruff check .
      - name: Ruff format
        if: matrix.os == 'ubuntu-latest'
        run: ruff format --check .
      - name: Test
        run: pytest --cov=semshift --cov-report=term-missing --cov-report=xml
      # Upload coverage once, from the canonical Linux + newest-Python job.
      # Repo owner must install the Codecov GitHub App at codecov.io. Do not add CODECOV_TOKEN.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
