name: Bug report
description: Report a reproducible SemShift bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, inputs, and expected vs actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SemShift version
      placeholder: "0.2.0"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, shell, and install method.
